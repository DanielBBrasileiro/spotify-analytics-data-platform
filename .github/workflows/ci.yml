name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Check Code Formatting
        run: |
          ruff format --check .

      - name: Run offline tests within five seconds
        run: |
          timeout 5s coverage run -m pytest --durations=5
          coverage report

  spark-contracts:
    name: Spark Contracts (Glue 5.1 parity)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: glue/requirements-dev.txt

      - name: Install Glue parity test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r glue/requirements-dev.txt

      - name: Run offline Spark contract suite
        env:
          SPARK_LOCAL_IP: 127.0.0.1
          PYSPARK_PYTHON: python
        run: |
          timeout 180s pytest tests/spark --durations=5

  snowflake-contracts:
    name: Snowflake SQL Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: snowflake/requirements-dev.txt

      - name: Install Snowflake contract tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r snowflake/requirements-dev.txt

      - name: Parse Snowflake SQL offline
        run: |
          sqlfluff parse --format none --dialect snowflake snowflake/ddl
          sqlfluff parse --format none --dialect snowflake snowflake/validation

      - name: Run Snowflake structural contracts
        run: |
          pytest tests/contracts -q

  dbt-contracts:
    name: dbt Parse Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: dbt/requirements-dev.txt

      - name: Install dbt contract tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r dbt/requirements-dev.txt

      - name: Install pinned dbt packages
        env:
          DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
        run: |
          dbt deps --project-dir dbt

      - name: Parse dbt project offline
        env:
          DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
        run: |
          dbt parse --no-partial-parse --project-dir dbt --profiles-dir tests/dbt_profile

      - name: Run dbt manifest contracts
        run: |
          pytest tests/dbt -q
