name: Bug Report
description: Report an issue or unexpected pipeline failure
labels: ["type:bug", "status:ready"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in the Spotify Analytics Data Platform.
        Please provide sufficient context and reproduction steps.
  - type: input
    id: component
    attributes:
      label: Pipeline Component
      description: Which component is affected? (e.g., Lambda, S3, Glue, Snowflake, dbt, Airflow, Terraform)
      placeholder: e.g., Glue / PySpark Silver Layer
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact commands or orchestrator runs that trigger the bug.
      placeholder: |
        1. Run `make ...` or trigger Airflow DAG `...`
        2. Inspect task failure at `...`
        3. Observe error trace
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Python version, OS, local or cloud execution context.
      value: |
        - OS: macOS / Linux
        - Python: 3.12
        - Execution Context: Local / Docker / AWS
