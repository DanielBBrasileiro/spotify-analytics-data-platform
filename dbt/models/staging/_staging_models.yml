version: 2

sources:
  - name: landing
    description: Typed Snowpipe destinations mirroring the six M3 Silver Parquet datasets.
    database: SPOTIFY_ANALYTICS
    schema: LANDING
    tables:
      - name: landing_artists
      - name: landing_albums
      - name: landing_tracks
      - name: landing_track_artists
      - name: landing_playlist_snapshots
      - name: landing_playlist_observations

models:
  - name: stg_spotify_artists
    description: Latest technically deduplicated artist record per provider artist ID.
    columns:
      - name: artist_id
        description: Provider-backed natural artist key.
        data_tests: [not_null, unique]
      - name: artist_name
        data_tests: [not_null]

  - name: stg_spotify_albums
    description: Latest album record with partial source release dates normalized to DATE.
    columns:
      - name: album_id
        description: Provider-backed natural album key.
        data_tests: [not_null, unique]
      - name: album_name
        data_tests: [not_null]

  - name: stg_spotify_tracks
    description: Latest valid provider-backed track metadata with positive duration.
    columns:
      - name: track_id
        description: Provider-backed natural track key.
        data_tests: [not_null, unique]
      - name: track_name
        data_tests: [not_null]
      - name: duration_ms
        data_tests: [not_null]

  - name: stg_spotify_track_artists
    description: Latest track-artist relationship per natural pair with current billing order.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [track_id, artist_id]
    columns:
      - name: track_id
        data_tests: [not_null]
      - name: artist_id
        data_tests: [not_null]
      - name: artist_order
        data_tests: [not_null]

  - name: stg_spotify_playlist_snapshots
    description: >-
      Track slots restricted to the authoritative winning physical observation for each
      playlist_id + snapshot_date. This prevents hybrid snapshots assembled from different
      retries and allows an empty winning observation to expose zero slots.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [playlist_id, snapshot_date, track_position]
    columns:
      - name: playlist_id
        data_tests: [not_null]
      - name: spotify_snapshot_id
        data_tests: [not_null]
      - name: playlist_name
        data_tests: [not_null]
      - name: track_id
        data_tests: [not_null]
      - name: track_position
        data_tests: [not_null]
      - name: snapshot_date
        data_tests: [not_null]
      - name: snapshot_timestamp
        data_tests: [not_null]
      - name: pipeline_run_id
        data_tests: [not_null]

  - name: stg_spotify_playlist_observations
    description: >-
      Authoritative daily playlist observation spine. Exactly one winning physical run is
      exposed per playlist/date even when that run contains zero valid track slots. A
      non-empty run is eligible only after all expected track positions have landed, so an
      independently arriving observation file cannot be mistaken for a transient empty run.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [playlist_id, snapshot_date]
    columns:
      - name: playlist_id
        data_tests: [not_null]
      - name: spotify_snapshot_id
        data_tests: [not_null]
      - name: playlist_name
        data_tests: [not_null]
      - name: snapshot_date
        data_tests: [not_null]
      - name: snapshot_timestamp
        data_tests: [not_null]
      - name: pipeline_run_id
        data_tests: [not_null]
      - name: source_item_count
        data_tests: [not_null]
      - name: valid_track_count
        data_tests: [not_null]
      - name: rejected_item_count
        data_tests: [not_null]
