name: spotify-orchestration

services:
  postgres:
    image: postgres:16.13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow-local
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 20

  airflow:
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    image: spotify-airflow:local
    command: standalone
    # Local portfolio runtime only; standalone starts API, scheduler, processor, triggerer.
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow-local@postgres/airflow
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/state/passwords.json
    volumes:
      - airflow-state:/opt/airflow/state
      - ./logs:/opt/airflow/logs
      - ./artifacts:/opt/airflow/artifacts
      - ../tmp/cc0-cloud-demo:/opt/airflow/demo:ro
      - ./secrets:/opt/airflow/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 20

volumes:
  postgres-data:
  airflow-state:
